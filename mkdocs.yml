site_name: "Manual básico de supervisión"
theme:
  name: material
  locale: "es"
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Cambiar a modo oscuro
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo light
nav:
    - EFS: "index.md"
    - EBS: "EBS.md"
